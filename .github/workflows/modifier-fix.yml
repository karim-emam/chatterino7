name: Nightly with Modifier Fix

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

env:
  CONAN_VERSION: 2.28.1

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout latest upstream Chatterino7
        uses: actions/checkout@v4
        with:
          repository: SevenTV/chatterino7
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Apply BTTV modifier emote fix
        shell: pwsh
        run: |
          $file = "src/providers/bttv/BttvEmotes.cpp"
          $content = Get-Content $file -Raw
          $orig = $content
          $content = $content -replace '(\.zeroWidth = ZERO_WIDTH_EMOTES\.contains\(name\.string\))', '$1 || jsonEmote.toObject().value("modifier").toBool()'
          $content = $content -replace '(\.zeroWidth = )false(,)', '$1jsonEmote.value("modifier").toBool()$2'
          if ($content -eq $orig) { Write-Error "Fix not applied - upstream file may have changed"; exit 1 }
          Set-Content $file $content -NoNewline
          Write-Host "Modifier fix applied successfully"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.9.3'
          cache: true

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.py') }}
          path: ~/.conan2/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan profile detect -f

      - name: Install dependencies
        run: |
          mkdir build
          cd build
          conan install .. `
            -s build_type=RelWithDebInfo `
            -c tools.cmake.cmaketoolchain:generator="Ninja" `
            -b missing `
            --output-folder=. `
            -o with_openssl3=True
          conan cache clean --source --build --download "*"

      - name: Configure CMake
        working-directory: build
        run: |
          cmake `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake `
            -DUSE_PRECOMPILED_HEADERS=ON `
            -DBUILD_WITH_CRASHPAD=ON `
            -DCHATTERINO_LTO=ON `
            -DFORCE_JSON_GENERATION=Off `
            -DCHATTERINO_SPELLCHECK=ON `
            ..

      - name: Build
        working-directory: build
        run: ninja

      - name: Build crashpad handler
        working-directory: build
        run: |
          ninja chatterino-crash-handler
          mkdir Chatterino2\crashpad
          cp bin\crashpad\crashpad-handler.exe Chatterino2\crashpad\

      - name: Deploy Qt
        working-directory: build
        run: |
          windeployqt bin\chatterino.exe --release --no-compiler-runtime --no-translations
          powershell -File ..\.CI\deploy-crt.ps1

      - name: Package
        working-directory: build
        run: 7z a chatterino-windows-x86-64-modifier-fix.zip Chatterino2\

      - name: Get date
        id: date
        shell: pwsh
        run: echo "date=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT

      - name: Create/Update Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: modifier-fix-latest
          name: "Chatterino7 + Modifier Fix (${{ steps.date.outputs.date }})"
          body: "Auto-built from latest SevenTV/chatterino7. Fix: w!, h!, v!, z! modifier emotes now render correctly instead of showing as separate icons."
          artifacts: build/chatterino-windows-x86-64-modifier-fix.zip
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
